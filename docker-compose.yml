services:
  postgres_db:
    image: postgres:17
    container_name: personal_finance_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./postgres_db:/var/lib/postgresql/data